name: Deploy
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Check server or deploy the verified revision
        type: choice
        options: [inspect, deploy]
        default: inspect
        required: true
permissions:
  contents: read
concurrency:
  group: gamelife-vpn-deploy
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Deploy to the project directory on the VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?set the Actions secret DEPLOY_HOST}" "${DEPLOY_USER:?set DEPLOY_USER}" "${SSH_KEY:?set DEPLOY_SSH_PRIVATE_KEY}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && "$DEPLOY_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]]
          keydir="$(mktemp -d)"
          trap 'rm -f "$keydir/key" "$keydir/hosts" "$keydir/result" "$keydir/error"; rmdir "$keydir"' EXIT
          umask 077
          printf '%s\n' "$SSH_KEY" > "$keydir/key"
          unset SSH_KEY
          if ! ssh-keygen -y -P '' -f "$keydir/key" >/dev/null 2>&1; then
            echo 'SSH key is invalid or requires a passphrase'
            exit 1
          fi
          if ! ssh-keyscan -T 10 -t ed25519 "$DEPLOY_HOST" > "$keydir/hosts" 2>/dev/null; then
            echo 'SSH host did not provide an ED25519 key'
            exit 1
          fi
          expected='SHA256:vraoI1+Yx3a6Yaw6I3yRi3uzJJg7KOZfq7O3GoEGVzc'
          if [[ "$(ssh-keygen -lf "$keydir/hosts" | awk '{print $2}' | sort -u)" != "$expected" ]]; then
            echo 'SSH host key does not match the recorded fingerprint'
            exit 1
          fi
          ssh_args=(-i "$keydir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keydir/hosts")
          if [[ "$OPERATION" == inspect ]]; then
            if ! ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < deploy/inspect.sh > "$keydir/result" 2> "$keydir/error"; then
              grep -E '^VPN_CHECK [a-z_]+=(yes|no|busy|free|unknown)$' "$keydir/result" || true
              if grep -qi 'Permission denied' "$keydir/error"; then
                echo 'SSH authentication was rejected for the configured user and key'
              elif grep -Eqi 'timed out|connection refused|connection reset|no route to host' "$keydir/error"; then
                echo 'SSH connection failed or timed out'
              else
                echo 'Server inspection could not complete'
              fi
              exit 1
            fi
            grep -E '^VPN_CHECK [a-z_]+=(yes|no|busy|free|unknown)$' "$keydir/result" || true
          elif [[ "$OPERATION" == deploy ]]; then
            if ! git archive "$GITHUB_SHA" | ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -eu; umask 077; cd; mkdir -p services/gamelife-vpn/releases/$GITHUB_SHA; cd services/gamelife-vpn/releases/$GITHUB_SHA; tar xf -; bash deploy/release.sh" \
              > "$keydir/result" 2> "$keydir/error"; then
              echo 'Deployment failed. Inspect the project directly on the server.'
              exit 1
            fi
            grep -E '^(Backend and PostgreSQL healthy|Panel bootstrap complete\.)' "$keydir/result" || true
          else
            echo 'Unsupported operation'
            exit 1
          fi
