name: Deploy
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Check server or deploy the verified revision
        type: choice
        options: [inspect, deploy]
        default: inspect
        required: true
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: gamelife-vpn-deploy
  cancel-in-progress: false
jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Require a successful CI run for this commit
        if: github.event_name == 'workflow_run' || inputs.operation == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$main_sha" != "$DEPLOY_SHA" ]]; then
            echo 'A newer commit is already on main'
            exit 1
          fi
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$DEPLOY_SHA&event=push&status=success&per_page=1" --jq .total_count)"
          if [[ "$count" -lt 1 ]]; then
            echo 'The current commit has not passed Verify'
            exit 1
          fi
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: github.event_name == 'workflow_run' || inputs.operation == 'deploy'
        with:
          go-version: '1.27.x'
      - name: Build Linux backend on the runner
        if: github.event_name == 'workflow_run' || inputs.operation == 'deploy'
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/vpn-api" .
      - name: Deploy to the project directory on the VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          OPERATION: ${{ github.event_name == 'workflow_run' && 'auto' || inputs.operation }}
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?set the Actions secret DEPLOY_HOST}" "${DEPLOY_USER:?set DEPLOY_USER}" "${SSH_KEY:?set DEPLOY_SSH_PRIVATE_KEY}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && "$DEPLOY_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_-]*$ ]]
          keydir="$(mktemp -d)"
          trap 'rm -f "$keydir/key" "$keydir/hosts" "$keydir/result" "$keydir/error"; rmdir "$keydir"' EXIT
          umask 077
          printf '%s\n' "$SSH_KEY" > "$keydir/key"
          unset SSH_KEY
          python3 -c 'import pathlib,sys; p=pathlib.Path(sys.argv[1]); b=p.read_bytes().replace(b"\r\n",b"\n"); b=b.replace(b"\\n",b"\n") if b.count(b"\n")<=1 and b"\\n" in b else b; p.write_bytes(b.rstrip(b"\n")+b"\n")' "$keydir/key"
          if ! ssh-keygen -y -P '' -f "$keydir/key" >/dev/null 2>&1; then
            if grep -qE '^-----BEGIN (OPENSSH|RSA|EC|DSA) PRIVATE KEY-----$' "$keydir/key"; then
              echo 'SSH private key could not be read; it may be incomplete or encrypted'
            elif grep -qE '^ssh-(ed25519|rsa) ' "$keydir/key"; then
              echo 'SSH secret contains a public key; a private key is required'
            else
              echo 'SSH secret does not contain a recognizable private key'
            fi
            exit 1
          fi
          if ! ssh-keyscan -T 10 -t ed25519 "$DEPLOY_HOST" > "$keydir/hosts" 2>/dev/null; then
            echo 'SSH host did not provide an ED25519 key'
            exit 1
          fi
          expected='SHA256:vraoI1+Yx3a6Yaw6I3yRi3uzJJg7KOZfq7O3GoEGVzc'
          if [[ "$(ssh-keygen -lf "$keydir/hosts" | awk '{print $2}' | sort -u)" != "$expected" ]]; then
            echo 'SSH host key does not match the recorded fingerprint'
            exit 1
          fi
          ssh_args=(-i "$keydir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$keydir/hosts")
          if [[ "$OPERATION" == inspect ]]; then
            if ! ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < deploy/inspect.sh > "$keydir/result" 2> "$keydir/error"; then
              grep -E '^VPN_CHECK [a-z0-9_]+=(yes|no|busy|free|unknown)$' "$keydir/result" || true
              if grep -qi 'Permission denied' "$keydir/error"; then
                echo 'SSH authentication was rejected for the configured user and key'
              elif grep -Eqi 'timed out|connection refused|connection reset|no route to host' "$keydir/error"; then
                echo 'SSH connection failed or timed out'
              else
                echo 'Server inspection could not complete'
              fi
              exit 1
            fi
            grep -E '^VPN_CHECK [a-z0-9_]+=(yes|no|busy|free|unknown)$' "$keydir/result" || true
          elif [[ "$OPERATION" == deploy || "$OPERATION" == auto ]]; then
            if [[ "$OPERATION" == auto ]]; then
              set +e
              ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" 'test -f "$HOME/services/gamelife-vpn/.env"' > "$keydir/result" 2> "$keydir/error"
              check_status=$?
              set -e
              if [[ "$check_status" == 1 ]]; then
                echo 'Automatic deployment awaits the initial setup'
                exit 0
              elif [[ "$check_status" != 0 ]]; then
                echo 'Could not check the initial setup on the server'
                exit 1
              fi
            fi
            release_dir="$(mktemp -d "$RUNNER_TEMP/vpn-release.XXXXXX")"
            git archive "$DEPLOY_SHA" | tar -xf - -C "$release_dir"
            cp "$RUNNER_TEMP/vpn-api" "$release_dir/vpn-api"
            if ! tar -cf - -C "$release_dir" . | ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "set -eu; umask 077; cd; mkdir -p services/gamelife-vpn/releases/$DEPLOY_SHA; cd services/gamelife-vpn/releases/$DEPLOY_SHA; tar xf -; bash deploy/release.sh" \
              > "$keydir/result" 2> "$keydir/error"; then
              echo 'Deployment failed. Inspect the project directly on the server.'
              exit 1
            fi
            grep -E '^(Backend and PostgreSQL healthy|Panel bootstrap complete\.)' "$keydir/result" || true
          else
            echo 'Unsupported operation'
            exit 1
          fi
