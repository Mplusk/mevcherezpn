name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  vpn_monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test external VPN monitoring
        run: python3 -m unittest discover -s deploy/monitor -p 'test_*.py' -v
  firewall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check firewall installation and Docker forwarding rules
        run: |
          bash -n deploy/firewall/*.sh
          python3 -m unittest discover -s deploy/firewall -p 'test_*.py' -v
          bash deploy/firewall/test-guard.sh
  life:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test the simulation and safe gateway rendering
        env:
          LIFE_DOCKER_TESTS: '1'
        run: |
          node --test deploy/life/life.test.js
          python3 -m unittest discover -s deploy/life -p 'test_*.py' -v
  backup_relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test relay routing, deployment and rollback
        env:
          RELAY_DOCKER_TESTS: '1'
        run: python3 -m unittest discover -s deploy/relay/tests -p 'test_*.py' -v
  hiddify_client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test automatic selection using Hiddify 4 and 5 cores
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --ignore-installed --require-hashes --only-binary=:all: -r deploy/hiddify/ci-requirements.txt
          for version in v4.1.0 v5.9.15; do
            archive="$RUNNER_TEMP/hiddify-$version.tar.gz"
            curl --fail --silent --show-error --location --retry 3 "https://github.com/hiddify/hiddify-core/releases/download/$version/hiddify-core-linux-amd64.tar.gz" -o "$archive"
            if [[ "$version" == v4.1.0 ]]; then
              checksum=79f55725b9c1c0b3cad46a45ededb3c5be83d7a6236cc1dfa9bd78fb3c687e6f
            else
              checksum=7793498bc9b86e58704a86f5517c5acceb4d907fd42cc30c80cd12ed8e9fa535
            fi
            echo "$checksum  $archive" | sha256sum -c -
            mkdir -p "$RUNNER_TEMP/hiddify-$version"
            tar -xzf "$archive" -C "$RUNNER_TEMP/hiddify-$version" --strip-components=1
          done
          export HIDDIFY_CORE_V4="$RUNNER_TEMP/hiddify-v4.1.0/hiddify-core"
          export HIDDIFY_CORE_V5="$RUNNER_TEMP/hiddify-v5.9.15/hiddify-core"
          export REQUIRE_HIDDIFY_CORE_TESTS=1
          python -m unittest discover -s deploy/hiddify -p 'test_*.py' -v
  secret_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$archive"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
      - run: go vet ./... && go test -race -v ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-password@127.0.0.1:5432/postgres?sslmode=disable
      - name: Build and start backend
        env:
          POSTGRES_PASSWORD: ci-password
          VPN_ADMIN_TOKEN: ci-token-for-integration-testing-only
          HIDDIFY_API_KEY: ci-key
          HIDDIFY_ADMIN_BASE: https://vpn.example/admin-path
          HIDDIFY_CLIENT_BASE: https://vpn.example/client-path
        run: |
          CGO_ENABLED=0 GOOS=linux go build -trimpath -o vpn-api .
          # Deployment archives are prepared under umask 077; the runtime user
          # must be able to execute the binary even when the host copy is private.
          chmod 700 vpn-api
          docker compose up -d --build --wait --wait-timeout 180
          curl --fail --silent http://127.0.0.1:18090/healthz
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test node timestamp correction
        run: python3 -m unittest discover -s deploy/hiddify -p 'test_*.py' -v
      - name: Boot isolated Hiddify and check TLS
        run: |
          export PANEL_DB_PASSWORD="$(openssl rand -hex 24)"
          export PANEL_REDIS_PASSWORD="$(openssl rand -hex 24)"
          export CADDY_NETWORK=vpn-ci-proxy
          test_home="$(realpath "$RUNNER_TEMP")/vpn-release-test"
          test_root="$test_home/services/gamelife-vpn"
          export VPN_HIDDIFY_PATCH_DIR="$test_root/hiddify-patches"
          mkdir -p "$VPN_HIDDIFY_PATCH_DIR"
          patch_files=(fix_node_timestamps.py auto_profile.py install_auto_profile.py)
          for patch_file in "${patch_files[@]}"; do cp "deploy/hiddify/$patch_file" "$VPN_HIDDIFY_PATCH_DIR/"; done
          export VPN_HIDDIFY_PATCH_SHA="$(for patch_file in "${patch_files[@]}"; do sha256sum "$VPN_HIDDIFY_PATCH_DIR/$patch_file" | awk '{print $1}'; done | sha256sum | awk '{print $1}')"
          docker network create "$CADDY_NETWORK"
          docker compose -f compose.panel.yaml up -d --wait --wait-timeout 600
          openssl s_client -connect 127.0.0.1:28443 -servername gamelife.shop </dev/null 2>/dev/null | openssl x509 -noout
          docker exec gamelife-hiddify-panel-1 /opt/hiddify-manager/.venv313/bin/python /usr/local/lib/gamelife-hiddify/fix_node_timestamps.py
          docker exec gamelife-hiddify-panel-1 /opt/hiddify-manager/.venv313/bin/python /usr/local/lib/gamelife-hiddify/install_auto_profile.py
          docker exec gamelife-hiddify-panel-1 grep -Fxq '        add_task "Warp" install_run services/warp false' /opt/hiddify-manager/scripts/install.sh
          docker restart gamelife-hiddify-panel-1 >/dev/null
          panel_restart_count="$(docker inspect gamelife-hiddify-panel-1 --format '{{.RestartCount}}')"
          panel_ready=no
          for attempt in $(seq 1 120); do
            if timeout 3 bash -c 'openssl s_client -connect 127.0.0.1:28443 -servername gamelife.shop </dev/null 2>/dev/null | openssl x509 -noout >/dev/null 2>&1'; then
              panel_ready=yes
              break
            fi
            sleep 2
          done
          test "$panel_ready" = yes
          sleep 15
          test "$panel_restart_count" = "$(docker inspect gamelife-hiddify-panel-1 --format '{{.RestartCount}}')"
          bash -n deploy/release.sh
          test_release="$test_root/releases/$GITHUB_SHA"
          mkdir -p "$test_release"
          git archive "$GITHUB_SHA" | tar -xf - -C "$test_release"
          {
            printf 'PANEL_DB_PASSWORD=%s\n' "$PANEL_DB_PASSWORD"
            printf 'PANEL_REDIS_PASSWORD=%s\n' "$PANEL_REDIS_PASSWORD"
            printf 'CADDY_NETWORK=%s\nHIDDIFY_API_KEY=\n' "$CADDY_NETWORK"
          } > "$test_root/.env"
          panel_before="$(docker compose -f compose.panel.yaml ps -q panel)"
          (cd "$test_release" && HOME="$test_home" bash deploy/release.sh)
          test -L "$test_root/current"
          docker run --rm --network "$CADDY_NETWORK" redis:7.4-alpine nc -z -w 5 gamelife-vpn-origin 80
          python3 deploy/smoke_panel.py
          (cd "$test_release" && HOME="$test_home" bash deploy/release.sh)
          test "$panel_before" = "$(docker compose -f compose.panel.yaml ps -q panel)"
          gateway_image='caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0'
          docker run --rm -v "$GITHUB_WORKSPACE/deploy/Caddyfile.standalone:/etc/caddy/Caddyfile:ro" "$gateway_image" caddy validate --config /etc/caddy/Caddyfile
          mkdir -p "$test_root/gateway"
          awk '{print; if ($0 == "gamelife.shop {" || $0 == "www.gamelife.shop {") print "\ttls internal"}' deploy/Caddyfile.standalone > "$test_root/gateway/Caddyfile"
          printf 'VPN_STANDALONE_GATEWAY=1\nVPN_GATEWAY_HTTP_PORT=18081\nVPN_GATEWAY_HTTPS_PORT=18443\n' >> "$test_root/.env"
          (cd "$test_release" && HOME="$test_home" bash deploy/release.sh)
          test "$panel_before" = "$(docker compose -f compose.panel.yaml ps -q panel)"
          ready=no
          for attempt in $(seq 1 30); do
            status="$(curl --silent --insecure --noproxy '*' --connect-timeout 2 --max-time 5 --resolve gamelife.shop:18443:127.0.0.1 -o /dev/null -w '%{http_code}' https://gamelife.shop:18443/ || true)"
            if [[ "$status" =~ ^[234][0-9][0-9]$ ]]; then ready=yes; break; fi
            sleep 2
          done
          test "$ready" = yes
          curl --fail --silent --insecure --noproxy '*' --resolve gamelife.shop:18443:127.0.0.1 https://gamelife.shop:18443/ -o "$RUNNER_TEMP/life.html"
          grep -Fq 'id="world"' "$RUNNER_TEMP/life.html"
          curl --fail --silent --insecure --noproxy '*' --resolve gamelife.shop:18443:127.0.0.1 https://gamelife.shop:18443/rules -o "$RUNNER_TEMP/life-rules.html"
          grep -Fq 'id="world"' "$RUNNER_TEMP/life-rules.html"
          test "$(curl --silent --insecure --noproxy '*' --resolve gamelife.shop:18443:127.0.0.1 -H 'X-GameLife-Decoy-Loop: 1' -o /dev/null -w '%{http_code}' https://gamelife.shop:18443/unknown)" = 404
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' $(docker compose -f compose.panel.yaml ps -q)
