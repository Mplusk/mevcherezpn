name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  secret_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$archive"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
      - run: go vet ./... && go test -race -v ./...
        env:
          TEST_DATABASE_URL: postgres://postgres:ci-password@127.0.0.1:5432/postgres?sslmode=disable
      - name: Build and start backend
        env:
          POSTGRES_PASSWORD: ci-password
          VPN_ADMIN_TOKEN: ci-token-for-integration-testing-only
          HIDDIFY_API_KEY: ci-key
          HIDDIFY_ADMIN_BASE: https://vpn.example/admin-path
          HIDDIFY_CLIENT_BASE: https://vpn.example/client-path
        run: |
          CGO_ENABLED=0 GOOS=linux go build -trimpath -o vpn-api .
          docker compose up -d --build --wait --wait-timeout 180
          curl --fail --silent http://127.0.0.1:18090/healthz
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Boot isolated Hiddify and check TLS
        run: |
          export PANEL_DB_PASSWORD="$(openssl rand -hex 24)"
          export PANEL_REDIS_PASSWORD="$(openssl rand -hex 24)"
          export CADDY_NETWORK=vpn-ci-proxy
          docker network create "$CADDY_NETWORK"
          docker compose -f compose.panel.yaml up -d --wait --wait-timeout 600
          openssl s_client -connect 127.0.0.1:28443 -servername gamelife.shop </dev/null 2>/dev/null | openssl x509 -noout
          docker exec gamelife-hiddify-panel-1 grep -Fxq '        add_task "Warp" install_run services/warp false' /opt/hiddify-manager/scripts/install.sh
          docker restart gamelife-hiddify-panel-1 >/dev/null
          panel_restart_count="$(docker inspect gamelife-hiddify-panel-1 --format '{{.RestartCount}}')"
          panel_ready=no
          for attempt in $(seq 1 120); do
            if timeout 3 bash -c 'openssl s_client -connect 127.0.0.1:28443 -servername gamelife.shop </dev/null 2>/dev/null | openssl x509 -noout >/dev/null 2>&1'; then
              panel_ready=yes
              break
            fi
            sleep 2
          done
          test "$panel_ready" = yes
          sleep 15
          test "$panel_restart_count" = "$(docker inspect gamelife-hiddify-panel-1 --format '{{.RestartCount}}')"
          bash -n deploy/release.sh
          test_home="$(realpath "$RUNNER_TEMP")/vpn-release-test"
          test_root="$test_home/services/gamelife-vpn"
          test_release="$test_root/releases/$GITHUB_SHA"
          mkdir -p "$test_release"
          git archive "$GITHUB_SHA" | tar -xf - -C "$test_release"
          {
            printf 'PANEL_DB_PASSWORD=%s\n' "$PANEL_DB_PASSWORD"
            printf 'PANEL_REDIS_PASSWORD=%s\n' "$PANEL_REDIS_PASSWORD"
            printf 'CADDY_NETWORK=%s\nHIDDIFY_API_KEY=\n' "$CADDY_NETWORK"
          } > "$test_root/.env"
          panel_before="$(docker compose -f compose.panel.yaml ps -q panel)"
          (cd "$test_release" && HOME="$test_home" bash deploy/release.sh)
          test -L "$test_root/current"
          docker run --rm --network "$CADDY_NETWORK" redis:7.4-alpine nc -z -w 5 gamelife-vpn-origin 80
          python3 deploy/smoke_panel.py
          (cd "$test_release" && HOME="$test_home" bash deploy/release.sh)
          test "$panel_before" = "$(docker compose -f compose.panel.yaml ps -q panel)"
          gateway_image='caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0'
          docker run --rm -v "$GITHUB_WORKSPACE/deploy/Caddyfile.standalone:/etc/caddy/Caddyfile:ro" "$gateway_image" caddy validate --config /etc/caddy/Caddyfile
          mkdir -p "$test_root/gateway"
          awk '{print; if ($0 == "gamelife.shop {" || $0 == "www.gamelife.shop {") print "\ttls internal"}' deploy/Caddyfile.standalone > "$test_root/gateway/Caddyfile"
          printf 'VPN_STANDALONE_GATEWAY=1\nVPN_GATEWAY_HTTP_PORT=18081\nVPN_GATEWAY_HTTPS_PORT=18443\n' >> "$test_root/.env"
          (cd "$test_release" && HOME="$test_home" bash deploy/release.sh)
          test "$panel_before" = "$(docker compose -f compose.panel.yaml ps -q panel)"
          ready=no
          for attempt in $(seq 1 30); do
            status="$(curl --silent --insecure --noproxy '*' --connect-timeout 2 --max-time 5 --resolve gamelife.shop:18443:127.0.0.1 -o /dev/null -w '%{http_code}' https://gamelife.shop:18443/ || true)"
            if [[ "$status" =~ ^[234][0-9][0-9]$ ]]; then ready=yes; break; fi
            sleep 2
          done
          test "$ready" = yes
          docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' $(docker compose -f compose.panel.yaml ps -q)
