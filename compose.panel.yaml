name: gamelife-hiddify
services:
  panel:
    image: ghcr.io/hiddify/hiddify-manager:v14.2.0@sha256:399c248e20d139a7dab9cf05566751bcbbce30b3a03ae832525e95dfb78333c9
    entrypoint:
      - /bin/bash
      - -ec
      - |
        # The pinned image already contains the panel package. Its durable data
        # keeps the upstream ownership setup; avoid copying the source tree on boot.
        if ! grep -Fxq 'uv pip install -e services/panel/src ' /opt/hiddify-manager/scripts/docker-init.sh; then
          echo 'Unexpected Hiddify entrypoint; refusing to start'
          exit 1
        fi
        source /opt/hiddify-manager/.venv313/bin/activate
        python -c 'import importlib.util as i; assert i.find_spec("hiddifypanel")'
        python /usr/local/lib/gamelife-hiddify/fix_node_timestamps.py
        sed '/^uv pip install -e services\/panel\/src *$$/d' /opt/hiddify-manager/scripts/docker-init.sh > /tmp/gamelife-hiddify-init.sh
        recursive_chown="$$(grep -Fxc 'chown -R hiddify-panel:hiddify-panel "$$PANEL_DIR" >/dev/null 2>&1' /opt/hiddify-manager/services/panel/run.sh || true)"
        single_chown="$$(grep -Fxc 'chown hiddify-panel:hiddify-panel "$$PANEL_DIR" >/dev/null 2>&1' /opt/hiddify-manager/services/panel/run.sh || true)"
        if [ "$$recursive_chown" = 1 ] && [ "$$single_chown" = 0 ]; then
          sed 's/^chown -R hiddify-panel:hiddify-panel /chown hiddify-panel:hiddify-panel /' /opt/hiddify-manager/services/panel/run.sh > /tmp/gamelife-panel-run.sh
          cat /tmp/gamelife-panel-run.sh > /opt/hiddify-manager/services/panel/run.sh
        elif [ "$$recursive_chown" != 0 ] || [ "$$single_chown" != 1 ]; then
          echo 'Unexpected Hiddify panel setup; refusing to start'
          exit 1
        fi
        if [ "$${VPN_DISABLE_WARP:-true}" = true ]; then
          enabled="$$(grep -Fxc '        add_task "Warp" install_run services/warp 1' /opt/hiddify-manager/scripts/install.sh || true)"
          disabled="$$(grep -Fxc '        add_task "Warp" install_run services/warp false' /opt/hiddify-manager/scripts/install.sh || true)"
          if [ "$$enabled" = 1 ] && [ "$$disabled" = 0 ]; then
            sed 's|^        add_task "Warp" install_run services/warp 1$$|        add_task "Warp" install_run services/warp false|' /opt/hiddify-manager/scripts/install.sh > /tmp/gamelife-install.sh
            cat /tmp/gamelife-install.sh > /opt/hiddify-manager/scripts/install.sh
          elif [ "$$enabled" != 0 ] || [ "$$disabled" != 1 ]; then
            echo 'Unexpected Hiddify WARP setup; refusing to start'
            exit 1
          fi
        elif [ "$${VPN_DISABLE_WARP}" != false ]; then
          echo 'Invalid VPN_DISABLE_WARP setting'
          exit 1
        fi
        exec /bin/bash /tmp/gamelife-hiddify-init.sh
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    environment:
      TZ: Etc/UTC
      UV_OFFLINE: "1"
      HIDDIFY_NO_HTTP_API: "true"
      VPN_DISABLE_WARP: ${VPN_DISABLE_WARP:-true}
      VPN_HIDDIFY_PATCH_SHA: ${VPN_HIDDIFY_PATCH_SHA:-development}
      MYSQL_DATABASE: hiddifypanel
      MYSQL_USER: hiddifypanel
      MYSQL_PASSWORD: ${PANEL_DB_PASSWORD:?generate a hex password}
      SQLALCHEMY_DATABASE_URI: mysql+mysqldb://hiddifypanel:${PANEL_DB_PASSWORD}@mariadb:3306/hiddifypanel?charset=utf8mb4
      REDIS_PASSWORD: ${PANEL_REDIS_PASSWORD:?generate a hex password}
      REDIS_URI_MAIN: redis://:${PANEL_REDIS_PASSWORD}@redis:6379/1
    volumes:
      - panel:/opt/hiddify-manager/data
      - ${VPN_HIDDIFY_PATCH_DIR:-./deploy/hiddify}:/usr/local/lib/gamelife-hiddify:ro
    ports:
      - "127.0.0.1:${PANEL_HTTPS_PORT:-28443}:443"
    networks:
      ingress: {}
      storage: {}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "openssl s_client -connect 127.0.0.1:443 -servername gamelife.shop </dev/null 2>/dev/null | openssl x509 -noout"]
      start_period: 15m
      interval: 30s
      timeout: 60s
      retries: 20
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: hiddifypanel
      MARIADB_USER: hiddifypanel
      MARIADB_PASSWORD: ${PANEL_DB_PASSWORD}
    networks: [storage]
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 15m
      interval: 30s
      timeout: 60s
      retries: 20
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${PANEL_REDIS_PASSWORD}
    command: ["sh", "-ec", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    networks: [storage]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      start_period: 10m
      interval: 30s
      timeout: 60s
      retries: 20
networks:
  ingress:
  storage:
    internal: true
volumes:
  panel:
  mariadb:
  redis:
